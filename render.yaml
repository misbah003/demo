services:
  - type: web
    name: navi-tax-ml-api
    region: frankfurt
    plan: free
    
    # Use Dockerfile for consistent Python 3.11.10
    dockerfile: Dockerfile
    
    # Environment variables
    envVars:
      - key: PORT
        value: 10000
      - key: FLASK_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
    
    # Health check
    healthCheckPath: /health
    healthCheckInterval: 60
    healthCheckTimeout: 10
    
    # GitHub integration (auto-deploy on push)
    repo: https://github.com/YOUR_USERNAME/navi-tax-35-main
    branch: master
    autoScaleFreeAccount: true