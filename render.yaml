services:
  - type: web
    name: navi-tax-ml-api
    runtime: python
    runtimeVersion: 3.11.9
    region: frankfurt
    plan: free
    
    # Build configuration
    buildCommand: |
      pip install --upgrade pip &&
      pip install -r requirements.txt
    
    # Start command - use gunicorn for production
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT --timeout 120 ml.ml_api_service_optimized:app
    
    # Environment variables
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 10000
      - key: FLASK_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
    
    # Autoscaling (free tier)
    scaling:
      minInstances: 1
      maxInstances: 1
    
    # Health check
    healthCheckPath: /health
    healthCheckInterval: 60
    healthCheckTimeout: 10
    
    # Dockerfile if you prefer
    # dockerfile: Dockerfile
    
    # GitHub integration (auto-deploy on push)
    repo: https://github.com/YOUR_USERNAME/navi-tax-35-main
    branch: main
    autoScaleFreeAccount: true